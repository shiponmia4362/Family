<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>পারিবারিক হিসাব খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#6366f1;
    --primary2:#8b5cf6;
    --green:#10b981;
    --red:#ef4444;
    --text:#1e2235;
    --muted:#7b8194;
    --card:#ffffff;
    --line:#eef0f6;
    --bg:#f3f5fb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .app{
    max-width:480px;margin:0 auto;min-height:100vh;
    background:var(--bg);position:relative;
    padding-bottom:110px;
    box-shadow:0 0 40px rgba(30,34,53,.08);
  }

  /* ---------- HEADER ---------- */
  .header{
    background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%);
    color:#fff;padding:16px 16px 24px;
    border-radius:0 0 28px 28px;
    box-shadow:0 10px 30px rgba(99,102,241,.30);
    position:relative;overflow:hidden;
  }
  .header::after{
    content:"";position:absolute;width:220px;height:220px;
    background:rgba(255,255,255,.10);border-radius:50%;
    top:-110px;right:-70px;
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
  .header-top h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.2px}
  .icon-btn{
    background:rgba(255,255,255,.18);border:none;color:#fff;
    font-family:inherit;font-size:13px;font-weight:600;
    padding:6px 11px;border-radius:20px;cursor:pointer;
    backdrop-filter:blur(4px);
  }
  .icon-btn:active{transform:scale(.95)}

  .balance-box{
    position:relative;z-index:1;margin-top:16px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.22);
    border-radius:18px;padding:14px 16px;
    backdrop-filter:blur(8px);
  }
  .balance-label{font-size:12.5px;opacity:.85;margin-bottom:3px}
  .balance{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
  .balance.neg{color:#ffe0e0}
  .stat-row{display:flex;gap:10px;margin-top:12px}
  .stat{
    flex:1;background:rgba(255,255,255,.16);border-radius:12px;
    padding:8px 11px;display:flex;flex-direction:column;gap:1px;
  }
  .stat span{font-size:11.5px;opacity:.85}
  .stat b{font-size:15.5px;font-weight:600}

  /* ---------- MONTH BAR ---------- */
  .month-bar{
    display:flex;align-items:center;justify-content:space-between;
    margin:16px 16px 0;background:var(--card);
    border-radius:14px;padding:7px 8px;
    box-shadow:0 2px 10px rgba(30,34,53,.06);
  }
  .month-bar button{
    width:34px;height:34px;border:none;border-radius:10px;
    background:#f1f2f9;color:var(--primary);font-size:18px;font-weight:700;
    cursor:pointer;font-family:inherit;line-height:1;
  }
  .month-bar button:active{background:#e6e8f5}
  #monthLabel{font-size:15px;font-weight:600}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;gap:6px;margin:14px 16px 0;
    background:#e9ecf6;border-radius:12px;padding:4px;
  }
  .tabs button{
    flex:1;border:none;background:transparent;font-family:inherit;
    font-size:13.5px;font-weight:600;color:var(--muted);
    padding:8px 0;border-radius:9px;cursor:pointer;transition:.18s;
  }
  .tabs button.active{
    background:#fff;color:var(--primary);
    box-shadow:0 2px 8px rgba(30,34,53,.10);
  }

  /* ---------- BREAKDOWN CARD ---------- */
  .card{
    background:var(--card);margin:14px 16px 0;border-radius:16px;
    box-shadow:0 2px 12px rgba(30,34,53,.06);overflow:hidden;
  }
  .card-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--text);padding:14px 16px;cursor:pointer;
  }
  .chev{transition:.25s;color:var(--muted);font-size:12px}
  .card.open .chev{transform:rotate(180deg)}
  .breakdown-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 16px}
  .card.open .breakdown-body{max-height:800px;padding-bottom:16px}
  .bar-row{margin-bottom:11px}
  .bar-row:last-child{margin-bottom:0}
  .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .bar-top span:last-child{color:var(--muted)}
  .bar{height:7px;background:#eef0f6;border-radius:6px;overflow:hidden}
  .bar .fill{height:100%;border-radius:6px;transition:width .35s ease}

  /* ---------- LIST ---------- */
  #list{margin:14px 16px 0}
  .day-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--muted);font-weight:600;
    padding:0 4px 7px;margin-top:14px;
  }
  .day-head:first-child{margin-top:0}
  .day-head .pos{color:var(--green)}
  .day-head .neg{color:var(--red)}

  .item{
    display:flex;align-items:center;gap:11px;
    background:var(--card);border-radius:14px;padding:11px 13px;
    margin-bottom:8px;cursor:pointer;
    box-shadow:0 1px 6px rgba(30,34,53,.05);
    transition:.15s;
  }
  .item:active{transform:scale(.985);background:#fafbff}
  .ico{
    width:40px;height:40px;border-radius:12px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:19px;
  }
  .ico.expense{background:#feeaea}
  .ico.income{background:#e3f9f0}
  .meta{flex:1;min-width:0}
  .ttl{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .amt{font-size:14.5px;font-weight:700;white-space:nowrap}
  .amt.expense{color:var(--red)}
  .amt.income{color:var(--green)}

  .empty{
    text-align:center;padding:50px 20px;color:var(--muted);
    font-size:14px;line-height:1.9;
  }
  .empty .big{font-size:44px;display:block;margin-bottom:8px;opacity:.5}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));
    right:calc(50% - 240px + 20px);
    width:60px;height:60px;border-radius:50%;border:none;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;font-size:30px;font-weight:300;line-height:1;
    box-shadow:0 8px 22px rgba(99,102,241,.45);
    cursor:pointer;z-index:20;transition:.15s;
  }
  .fab:active{transform:scale(.92)}
  @media(max-width:520px){ .fab{right:20px} }

  /* ---------- FOOTER ---------- */
  .footer{
    display:flex;gap:10px;justify-content:center;
    margin:26px 16px 0;
  }
  .footer button{
    flex:1;border:1px dashed #cfd4e6;background:transparent;
    color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;
    padding:11px;border-radius:12px;cursor:pointer;
  }
  .footer button:active{background:#eaedf7}

  /* ---------- MODAL ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(15,23,42,.55);
    display:none;align-items:flex-end;justify-content:center;
    z-index:50;backdrop-filter:blur(2px);
  }
  .modal.open{display:flex}
  .modal-content{
    background:#fff;width:100%;max-width:480px;
    border-radius:24px 24px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .26s cubic-bezier(.2,.8,.3,1);
    max-height:92vh;overflow-y:auto;
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @media(min-width:520px){
    .modal{align-items:center}
    .modal-content{border-radius:24px;max-width:420px;animation:pop .22s ease}
    @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-head h2{font-size:17px;margin:0;font-weight:600}
  .modal-head button{
    width:32px;height:32px;border-radius:50%;border:none;background:#f1f2f9;
    color:var(--muted);font-size:15px;cursor:pointer;font-family:inherit;
  }

  .type-toggle{display:flex;gap:8px;margin-bottom:16px}
  .type-toggle button{
    flex:1;padding:11px;border-radius:12px;border:2px solid var(--line);
    background:#fff;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--muted);cursor:pointer;transition:.18s;
  }
  .type-toggle button.active[data-t="expense"]{border-color:var(--red);background:#fef2f2;color:var(--red)}
  .type-toggle button.active[data-t="income"]{border-color:var(--green);background:#ecfdf5;color:var(--green)}

  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .field input,.field select{
    width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);
    font-family:inherit;font-size:15px;background:#fafbff;color:var(--text);
    outline:none;transition:.18s;
  }
  .field input:focus,.field select:focus{border-color:var(--primary);background:#fff}
  .field input[type="number"]{font-size:20px;font-weight:600}

  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions button{
    flex:1;padding:14px;border-radius:14px;border:none;
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  }
  .primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
  .danger{background:#feeaea;color:var(--red);flex:0 0 96px !important}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-top">
      <h1>🏠 পারিবারিক হিসাব খাতা</h1>
      <button class="icon-btn" id="digitToggle" title="সংখ্যার ধরন">১২৩</button>
    </div>
    <div class="balance-box">
      <div class="balance-label">সর্বমোট ব্যালেন্স</div>
      <div class="balance" id="balance">৳ ০</div>
      <div class="stat-row">
        <div class="stat"><span>এই মাসের আয়</span><b id="totalIncome">৳ ০</b></div>
        <div class="stat"><span>এই মাসের ব্যয়</span><b id="totalExpense">৳ ০</b></div>
      </div>
    </div>
  </header>

  <!-- MONTH -->
  <div class="month-bar">
    <button id="prevMonth">‹</button>
    <div id="monthLabel">—</div>
    <button id="nextMonth">›</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button data-type="all" class="active">সব</button>
    <button data-type="income">আয়</button>
    <button data-type="expense">ব্যয়</button>
  </div>

  <!-- BREAKDOWN -->
  <div class="card" id="breakdownCard">
    <button class="card-head" id="breakdownToggle">
      <span>📊 খাত অনুযায়ী ব্যয়</span>
      <span class="chev">▾</span>
    </button>
    <div class="breakdown-body" id="breakdownBody"></div>
  </div>

  <!-- LIST -->
  <div id="list"></div>
  <div id="empty" class="empty" style="display:none">
    <span class="big">📒</span>
    এই মাসে এখনো কোনো হিসাব নেই।<br>নিচের <b>+</b> বোতাম চেপে যোগ করুন।
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <button id="exportBtn">⬇ ব্যাকআপ নিন</button>
    <button id="importBtn">⬆ রিস্টোর করুন</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <!-- FAB -->
  <button class="fab" id="addBtn" aria-label="নতুন এন্ট্রি">+</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-head">
      <h2 id="modalTitle">নতুন এন্ট্রি</h2>
      <button id="closeModal">✕</button>
    </div>

    <div class="type-toggle">
      <button data-t="expense" class="active">ব্যয়</button>
      <button data-t="income">আয়</button>
    </div>

    <div class="field">
      <label>পরিমাণ (৳)</label>
      <input type="number" id="amount" inputmode="decimal" placeholder="0" step="any" min="0">
    </div>

    <div class="field">
      <label>খাত</label>
      <select id="category"></select>
    </div>

    <div class="field">
      <label>তারিখ</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label>বিবরণ (ঐচ্ছিক)</label>
      <input type="text" id="note" placeholder="যেমন: সাপ্তাহিক বাজার" maxlength="60">
    </div>

    <div class="modal-actions">
      <button id="deleteBtn" class="danger hidden">মুছুন</button>
      <button id="saveBtn" class="primary">সংরক্ষণ করুন</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ================== কনফিগ ================== */
  const STORE_KEY = 'familyBudget_v1';
  const PREF_KEY  = 'familyBudget_prefs';

  const CATS = {
    expense: [
      { id:'food',      name:'খাবার',          icon:'🍚' },
      { id:'bazar',     name:'বাজার',          icon:'🛒' },
      { id:'rent',      name:'বাসা ভাড়া',      icon:'🏠' },
      { id:'utility',   name:'বিদ্যুৎ/পানি',   icon:'💡' },
      { id:'gas',       name:'গ্যাস',          icon:'🔥' },
      { id:'internet',  name:'ইন্টারনেট',      icon:'🌐' },
      { id:'mobile',    name:'মোবাইল রিচার্জ', icon:'📱' },
      { id:'transport', name:'যাতায়াত',        icon:'🚌' },
      { id:'education', name:'শিক্ষা',         icon:'📚' },
      { id:'health',    name:'চিকিৎসা',        icon:'💊' },
      { id:'clothes',   name:'পোশাক',          icon:'👕' },
      { id:'festival',  name:'ঈদ/উৎসব',        icon:'🎉' },
      { id:'loan',      name:'কিস্তি/ঋণ',      icon:'🏦' },
      { id:'saving',    name:'সঞ্চয়',          icon:'💰' },
      { id:'other_exp', name:'অন্যান্য',        icon:'📌' }
    ],
    income: [
      { id:'salary',    name:'বেতন',       icon:'💵' },
      { id:'business',  name:'ব্যবসা',      icon:'🏪' },
      { id:'rent_in',   name:'বাড়ি ভাড়া',  icon:'🏘️' },
      { id:'bonus',     name:'বোনাস',      icon:'🎁' },
      { id:'gift',      name:'উপহার',      icon:'🎀' },
      { id:'other_inc', name:'অন্যান্য',    icon:'📌' }
    ]
  };

  const MONTHS_BN = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন',
                     'জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  const DAYS_BN   = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  const BN_DIGITS = '০১২৩৪৫৬৭৮৯';
  const COLORS    = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981',
                     '#06b6d4','#f43f5e','#84cc16','#a855f7','#0ea5e9'];

  /* ================== স্টেট ================== */
  let data = load();
  let prefs = loadPrefs();
  let currentMonth = ym(new Date());
  let filter = 'all';
  let editingId = null;
  let formType = 'expense';

  /* ================== হেল্পার ================== */
  const $ = id => document.getElementById(id);

  function load() {
    try { const a = JSON.parse(localStorage.getItem(STORE_KEY)); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

  function loadPrefs() {
    try { return Object.assign({ bn:false }, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); }
    catch (e) { return { bn:false }; }
  }
  function savePrefs() { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }

  function toBn(s) { return String(s).replace(/[0-9]/g, d => BN_DIGITS[+d]); }
  function num(n) {
    const s = Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    return prefs.bn ? toBn(s) : s;
  }
  function money(n) { return '৳ ' + num(n); }

  function ym(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function todayStr() {
    const d = new Date();
    return ym(d) + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parseDate(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function monthLabel(m) {
    const p = m.split('-').map(Number);
    return MONTHS_BN[p[1] - 1] + ' ' + (prefs.bn ? toBn(p[0]) : p[0]);
  }
  function fmtDate(s) {
    const d = parseDate(s);
    const day = prefs.bn ? toBn(d.getDate()) : d.getDate();
    return day + ' ' + MONTHS_BN[d.getMonth()] + ', ' + DAYS_BN[d.getDay()];
  }
  function sum(arr) { return arr.reduce((s, e) => s + Number(e.amount || 0), 0); }
  function getCat(type, id) { return (CATS[type] || []).find(c => c.id === id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  /* ================== রেন্ডার ================== */
  function render() {
    const monthEntries = data.filter(e => e.date.slice(0, 7) === currentMonth);
    const inc = sum(monthEntries.filter(e => e.type === 'income'));
    const exp = sum(monthEntries.filter(e => e.type === 'expense'));
    const allInc = sum(data.filter(e => e.type === 'income'));
    const allExp = sum(data.filter(e => e.type === 'expense'));
    const bal = allInc - allExp;

    const balEl = $('balance');
    balEl.textContent = money(bal);
    balEl.classList.toggle('neg', bal < 0);

    $('totalIncome').textContent  = money(inc);
    $('totalExpense').textContent = money(exp);
    $('monthLabel').textContent   = monthLabel(currentMonth);

    renderList(monthEntries);
    renderBreakdown(monthEntries);
  }

  function renderList(monthEntries) {
    const listEl = $('list');
    const emptyEl = $('empty');
    const filtered = monthEntries
      .filter(e => filter === 'all' || e.type === filter)
      .sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));

    if (!filtered.length) {
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    const groups = {};
    filtered.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });

    let html = '';
    Object.keys(groups).sort().reverse().forEach(date => {
      const items = groups[date];
      const dayTotal = items.reduce((s, e) => s + (e.type === 'expense' ? -e.amount : e.amount), 0);

      html += `<div class="day-head">
        <span>${fmtDate(date)}</span>
        <span class="${dayTotal < 0 ? 'neg' : 'pos'}">${dayTotal < 0 ? '-' : '+'}${money(dayTotal)}</span>
      </div>`;

      items.forEach(e => {
        const c = getCat(e.type, e.cat);
        html += `<div class="item" data-id="${e.id}">
          <div class="ico ${e.type}">${c ? c.icon : '📌'}</div>
          <div class="meta">
            <div class="ttl">${c ? c.name : 'অন্যান্য'}</div>
            ${e.note ? `<div class="sub">${esc(e.note)}</div>` : ''}
          </div>
          <div class="amt ${e.type}">${e.type === 'expense' ? '-' : '+'}${money(e.amount)}</div>
        </div>`;
      });
    });

    listEl.innerHTML = html;
  }

  function renderBreakdown(monthEntries) {
    const body = $('breakdownBody');
    const exp = monthEntries.filter(e => e.type === 'expense');
    const total = sum(exp);

    if (!total) {
      body.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:4px 0 6px">
        এই মাসে এখনো কোনো ব্যয় নেই।</div>`;
      return;
    }

    const byCat = {};
    exp.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
    const arr = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

    body.innerHTML = arr.map(([id, amt], i) => {
      const c = getCat('expense', id);
      const pct = Math.round((amt / total) * 100);
      const color = COLORS[i % COLORS.length];
      return `<div class="bar-row">
        <div class="bar-top">
          <span>${c ? c.icon + ' ' + c.name : '📌 অন্যান্য'}</span>
          <span>${money(amt)} · ${prefs.bn ? toBn(pct) : pct}%</span>
        </div>
        <div class="bar"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
      </div>`;
    }).join('');
  }

  /* ================== মডাল ================== */
  function setFormType(t) {
    formType = t;
    document.querySelectorAll('.type-toggle button').forEach(b =>
      b.classList.toggle('active', b.dataset.t === t));
    $('category').innerHTML = CATS[t]
      .map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  }

  function defaultDate() {
    return ym(new Date()) === currentMonth ? todayStr() : currentMonth + '-01';
  }

  function openModal(entry) {
    editingId = entry ? entry.id : null;
    setFormType(entry ? entry.type : 'expense');

    $('amount').value = entry ? entry.amount : '';
    $('date').value   = entry ? entry.date : defaultDate();
    $('note').value   = entry ? (entry.note || '') : '';
    $('category').value = entry ? entry.cat : CATS[formType][0].id;

    $('modalTitle').textContent = entry ? 'এন্ট্রি সম্পাদনা' : 'নতুন এন্ট্রি';
    $('deleteBtn').classList.toggle('hidden', !entry);
    $('modal').classList.add('open');
    if (!entry) setTimeout(() => $('amount').focus(), 220);
  }

  function closeModal() {
    $('modal').classList.remove('open');
    editingId = null;
  }

  function saveEntry() {
    const amount = parseFloat($('amount').value);
    if (!amount || amount <= 0 || isNaN(amount)) {
      alert('অনুগ্রহ করে সঠিক পরিমাণ লিখুন।');
      $('amount').focus();
      return;
    }
    const date = $('date').value || todayStr();
    const cat  = $('category').value;
    const note = $('note').value.trim();

    if (editingId) {
      const e = data.find(x => x.id === editingId);
      if (e) Object.assign(e, { type: formType, amount, date, cat, note });
    } else {
      data.push({
        id: Date.now() + Math.floor(Math.random() * 1000),
        created: Date.now(),
        type: formType, amount, date, cat, note
      });
    }

    save();
    currentMonth = date.slice(0, 7);   // যেই মাসে যোগ হলো সেটাই দেখাও
    closeModal();
    render();
  }

  function deleteEntry() {
    if (!editingId) return;
    if (!confirm('এই এন্ট্রিটি মুছে ফেলতে চান?')) return;
    data = data.filter(x => x.id !== editingId);
    save();
    closeModal();
    render();
  }

  /* ================== ব্যাকআপ ================== */
  function exportData() {
    if (!data.length) { alert('ব্যাকআপ নেওয়ার মতো কোনো ডেটা নেই।'); return; }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'hisab-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = JSON.parse(reader.result);
        if (!Array.isArray(arr)) throw new Error('bad');
        const ids = new Set(data.map(x => x.id));
        let added = 0;
        arr.forEach(x => {
          if (x && x.date && x.amount && x.type && !ids.has(x.id)) {
            data.push(x); ids.add(x.id); added++;
          }
        });
        save(); render();
        alert(added + ' টি এন্ট্রি রিস্টোর হয়েছে।');
      } catch (e) {
        alert('ফাইলটি সঠিক ব্যাকআপ ফাইল নয়।');
      }
    };
    reader.readAsText(file);
  }

  /* ================== ইভেন্ট ================== */
  $('prevMonth').addEventListener('click', () => changeMonth(-1));
  $('nextMonth').addEventListener('click', () => changeMonth(1));

  function changeMonth(delta) {
    let p = currentMonth.split('-').map(Number);
    let y = p[0], m = p[1] + delta;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    currentMonth = y + '-' + String(m).padStart(2, '0');
    render();
  }

  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.type;
      document.querySelectorAll('.tabs button').forEach(b =>
        b.classList.toggle('active', b === btn));
      render();
    });
  });

  $('breakdownToggle').addEventListener('click', () => {
    $('breakdownCard').classList.toggle('open');
  });

  $('addBtn').addEventListener('click', () => openModal(null));
  $('closeModal').addEventListener('click', closeModal);
  $('saveBtn').addEventListener('click', saveEntry);
  $('deleteBtn').addEventListener('click', deleteEntry);

  $('modal').addEventListener('click', e => {
    if (e.target === $('modal')) closeModal();
  });

  document.querySelectorAll('.type-toggle button').forEach(btn => {
    btn.addEventListener('click', () => setFormType(btn.dataset.t));
  });

  // লিস্টে ক্লিক → সম্পাদনা
  $('list').addEventListener('click', e => {
    const item = e.target.closest('.item');
    if (!item) return;
    const id = Number(item.dataset.id);
    const entry = data.find(x => x.id === id);
    if (entry) openModal(entry);
  });

  // বাংলা / ইংরেজি সংখ্যা টগল
  $('digitToggle').addEventListener('click', () => {
    prefs.bn = !prefs.bn;
    savePrefs();
    $('digitToggle').textContent = prefs.bn ? '123' : '১২৩';
    render();
  });

  $('exportBtn').addEventListener('click', exportData);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) importData(f);
    e.target.value = '';
  });

  // Enter চাপলে সেভ
  $('amount').addEventListener('keydown', e => { if (e.key === 'Enter') $('note').focus(); });
  $('note').addEventListener('keydown', e => { if (e.key === 'Enter') saveEntry(); });

  /* ================== শুরু ================== */
  $('digitToggle').textContent = prefs.bn ? '123' : '১২৩';
  render();

})();
</script>
</body>
</html>
